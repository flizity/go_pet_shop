version: "3"

tasks:
  generate:
    aliases: [migrate]
    desc: "Generate migrations for the database"
    dotenv: [".env"]
    cmds:
      - go run cmd/migrator/main.go --migrations-path "./migrations"

  linter:
    desc: "Run linters on the codebase"
    cmds:
      - golangci-lint run ./...

linters:
  enable:
    - unused
    - bodyclose
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - gocyclo

run:
  timeout: 2m
  tests: true

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0